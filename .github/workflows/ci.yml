name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    name: Lint · Types · Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint & format (Biome)
        run: pnpm exec biome ci ./src

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & integration tests
        run: pnpm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Não-bloqueante: os smoke tests exigem build + browsers e, para o fluxo
    # completo de login, segredos do Firebase ainda não configurados no CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Verify font assets
        run: node scripts/verify-font-assets.mjs

      - name: Run E2E
        run: pnpm e2e
